# YAMNet AudioSet → Recognize genre labels
# Maps AudioSet class names (lowercased) to the same 15 MSD output genres.
# Uses 'see:' aliases so multiple AudioSet classes map to one output label.
# Thresholds are much lower than musicnn_rules.yml because YAMNet uses
# sigmoid outputs across 521 classes — genre-specific scores are typically 1-5%.

rap:
  label: rap
  threshold: 0.01

rapping:
  see: rap

hip hop music:
  see: rap

